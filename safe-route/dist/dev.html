<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f1416">
  <title>경보 이전 · 레벨 뷰어</title>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
  <style>
    :root { color-scheme: dark; --bg: rgba(14, 19, 22, 0.86); --line: rgba(255, 255, 255, 0.12); --fg: #e8ecee; --dim: #9aa6ad; --teal: #3cc6b5; --amber: #f2b33d; --red: #e5484d; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0f1416; color: var(--fg); font: 13px/1.45 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif; overflow: hidden; }
    #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #panel { position: fixed; top: 10px; right: 10px; width: min(320px, calc(100vw - 20px)); max-height: calc(100vh - 20px); overflow: auto; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); backdrop-filter: blur(10px); }
    #panel.hidden > :not(#toggle) { display: none; }
    #panel h2 { margin: 12px 0 6px; font-size: 12px; font-weight: 700; color: var(--dim); letter-spacing: 0.04em; }
    #panel h2:first-of-type { margin-top: 8px; }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
    .row > label { min-width: 52px; color: var(--dim); }
    select, button { font: inherit; color: var(--fg); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
    select { flex: 1; min-width: 0; }
    select option { background: #182024; }
    button { cursor: pointer; text-align: left; }
    button:hover { background: rgba(255, 255, 255, 0.12); }
    button[aria-pressed="true"] { border-color: var(--teal); background: rgba(60, 198, 181, 0.18); }
    :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    .list { display: flex; flex-direction: column; gap: 3px; }
    .list button { width: 100%; display: flex; justify-content: space-between; gap: 8px; }
    .list button small { color: var(--dim); white-space: nowrap; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .stats { font-variant-numeric: tabular-nums; color: var(--dim); white-space: pre-line; }
    .tile { margin: 8px 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); }
    .tile.ok::before { content: '● '; color: var(--teal); }
    .tile.busy::before { content: '◌ '; color: var(--amber); }
    .tile.error { border-color: var(--red); background: rgba(229, 72, 77, 0.14); white-space: pre-wrap; word-break: break-word; }
    .tile.error::before { content: '⚠ 오류 · '; color: var(--red); font-weight: 700; }
    .help { color: var(--dim); font-size: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); opacity: 0; transition: opacity 0.2s; pointer-events: none; max-width: calc(100vw - 32px); }
    #toast.show { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
  </style>
</head>
<body>
  <canvas id="world" tabindex="0" aria-label="레벨 미리보기. WASD 또는 방향키로 이동, 마우스로 끌어서 둘러보기, E로 상호작용, V로 시점 전환."></canvas>
  <aside id="panel" aria-label="레벨 뷰어 패널"></aside>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./dev.js"></script>
</body>
</html>
